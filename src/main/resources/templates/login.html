<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | Digital Warranty Locker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #f8fafc
                );
        }

        .login-container {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.12);

        }

        .logo {

            width: 70px;

            height: 70px;

            margin: 0 auto 15px;

            border-radius: 50%;

            background: #2563eb;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 32px;

        }

        h1 {

            text-align: center;

            margin: 0;

            color: #111827;

            font-size: 28px;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-top: 8px;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

        }

        input:focus {

            border-color: #2563eb;

            box-shadow:
                0 0 0 3px rgba(37,99,235,0.12);
        }

        .login-button {

            width: 100%;

            margin-top: 28px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

        }

        .login-button:hover {

            background: #1d4ed8;
        }

        #message {

            text-align: center;

            margin-top: 15px;

            color: #dc2626;

            font-weight: bold;

        }

        .footer {

            text-align: center;

            margin-top: 25px;

            color: #94a3b8;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="logo">
        🔐
    </div>


    <h1>
        Digital Warranty Locker
    </h1>


    <div class="subtitle">
        Secure Warranty Management System
    </div>


    <label>
        Username
    </label>

    <input
        type="text"
        id="username"
        placeholder="Enter username"
    >


    <label>
        Password
    </label>

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >


    <button
        class="login-button"
        onclick="login()"
    >
        Login
    </button>


    <div id="message"></div>


    <div class="footer">
        Digital Warranty Locker © 2026
    </div>


</div>


<script>

function login() {

    const username =
        document
            .getElementById("username")
            .value
            .trim();


    const password =
        document
            .getElementById("password")
            .value
            .trim();


    if (
        username !== "" &&
        password !== ""
    ) {

        sessionStorage.setItem(
            "loggedIn",
            "true"
        );

        window.location.href = "/";

    }

    else {

        document
            .getElementById("message")
            .innerText =
            "Please enter username and password.";

    }

}

</script>


</body>

</html>
