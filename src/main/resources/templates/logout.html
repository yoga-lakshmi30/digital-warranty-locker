<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Logout | Digital Warranty Locker</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #dbeafe,
                    #f8fafc
                );
        }

        .logout-container {

            width: 400px;

            background: white;

            padding: 45px 40px;

            border-radius: 18px;

            text-align: center;

            box-shadow:
                0 15px 40px rgba(0,0,0,0.12);
        }

        .icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #dcfce7;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 35px;
        }

        h1 {

            margin: 0;

            color: #111827;

            font-size: 28px;
        }

        p {

            color: #64748b;

            margin-top: 12px;

            font-size: 16px;
        }

        .login-button {

            display: inline-block;

            margin-top: 20px;

            padding: 13px 30px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            font-weight: bold;

            font-size: 15px;
        }

        .login-button:hover {

            background: #1d4ed8;
        }

        .footer {

            margin-top: 30px;

            color: #94a3b8;

            font-size: 13px;
        }

    </style>

</head>


<body>


<div class="logout-container">


    <div class="icon">
        ✓
    </div>


    <h1>
        Logout Successful
    </h1>


    <p>
        You have been safely logged out.
    </p>


    <a
        href="/login"
        class="login-button">

        Go to Login

    </a>


    <div class="footer">

        Digital Warranty Locker © 2026

    </div>


</div>


</body>

</html>
